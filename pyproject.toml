[project]
name = "llmtxt"
version = "0.1.0"
description = "A simple DSPy project that scans a Python project and generates a standards-compliant llm.txt"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "click>=8.4.2",
    "dspy>=3.2.1",
]

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
